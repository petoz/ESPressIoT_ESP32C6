name: Build and Release Firmware

on:
  push:
    tags:
      - 'v*'
      - '[0-9]+.[0-9]+.[0-9]+*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install PlatformIO and dependencies
        run: |
          python -m pip install --upgrade pip
          pip install platformio

      - name: Build firmware
        run: |
          pio run

      - name: Prepare release assets
        run: |
          mkdir -p release_assets
          cp .pio/build/esp32-c6-devkitc-1/firmware.bin release_assets/firmware.bin
          cp .pio/build/esp32-c6-devkitc-1/bootloader.bin release_assets/bootloader.bin
          cp .pio/build/esp32-c6-devkitc-1/partitions.bin release_assets/partitions.bin

      - name: Check if prerelease
        id: check_prerelease
        run: |
          TAG_NAME="${{ github.ref_name }}"
          if [[ "$TAG_NAME" == *"beta"* || "$TAG_NAME" == *"rc"* || "$TAG_NAME" == *"alpha"* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release_assets/firmware.bin
            release_assets/bootloader.bin
            release_assets/partitions.bin
          prerelease: ${{ steps.check_prerelease.outputs.prerelease }}
          generate_release_notes: true
